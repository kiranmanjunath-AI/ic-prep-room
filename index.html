<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>IC Prep Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg:#EEF0F5; --surface:#FFFFFF; --raised:#E5E8F0; --border:#C8CDD8;
  --text:#1A1E2C; --muted:#5A6070;
  --infra:#9A6E12; --credit:#267A6C;
  --b-agg:#C83030; --b-asm:#C07828; --b-con:#358058; --b-bmk:#4A70B8;
  --deal:var(--infra);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --surface:#191D26; --raised:#1F2435; --border:#2D3346;
    --text:#DDE2EE; --muted:#8892A8; --infra:#C68B2E; --credit:#3DA897;
  }
}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#191D26; --raised:#1F2435; --border:#2D3346;
  --text:#DDE2EE; --muted:#8892A8; --infra:#C68B2E; --credit:#3DA897;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Syne',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:13px;}

/* Layout */
#app{display:flex;flex-direction:column;height:100vh;}
#top-bar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:0;flex-shrink:0;}
#main-layout{flex:1;display:grid;grid-template-columns:196px 1fr 330px;overflow:hidden;}
#section-nav{border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);padding:12px 0;}
#content-area{overflow-y:auto;padding:28px 40px;background:var(--bg);}
.memo-inner{max-width:640px;margin:0 auto;}
#right-panel{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
#scenario-bar{border-top:1px solid var(--border);background:var(--surface);height:96px;flex-shrink:0;display:flex;align-items:center;padding:0 20px;gap:20px;overflow:hidden;}

/* Top bar */
.wordmark{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-right:20px;}
.deal-tabs{display:flex;gap:2px;background:var(--raised);border-radius:4px;padding:3px;}
.deal-tab{padding:5px 13px;border-radius:3px;cursor:pointer;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--muted);border:none;background:transparent;transition:all .15s;font-family:'Syne',sans-serif;}
.deal-tab.active{background:var(--deal);color:#fff;}
.rec-chip{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;padding:4px 10px;border-radius:3px;letter-spacing:.04em;white-space:nowrap;}
.rec-cond{background:rgba(212,144,58,.18);color:#D4903A;border:1px solid rgba(212,144,58,.35);}

/* Nav */
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 14px;margin:8px 0 4px;}
.nav-item{display:flex;align-items:flex-start;gap:9px;padding:7px 14px;cursor:pointer;font-size:11.5px;font-weight:500;color:var(--muted);border-left:2px solid transparent;transition:all .12s;line-height:1.4;}
.nav-item:hover{color:var(--text);background:var(--raised);}
.nav-item.active{color:var(--deal);border-left-color:var(--deal);background:var(--raised);font-weight:600;}
.nav-num{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);flex-shrink:0;margin-top:1px;}

/* Content */
.section-eye{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--deal);margin-bottom:6px;}
.section-title{font-family:'Libre Baskerville',Georgia,serif;font-size:21px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:18px;text-wrap:balance;}
.memo-body{font-family:'Libre Baskerville',Georgia,serif;font-size:13.5px;line-height:1.78;color:var(--text);}
.memo-body p{margin-bottom:14px;}
.data-table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin:18px 0;font-variant-numeric:tabular-nums;}
.data-table th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--border);}
.data-table td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);}
.data-table tr:last-child td{border-bottom:none;}
.data-table .r{text-align:right;}
.metrics-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
.m-tile{background:var(--raised);border:1px solid var(--border);border-radius:4px;padding:9px 13px;min-width:90px;}
.m-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.m-val{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:var(--text);}
.m-sub{font-size:9px;color:var(--muted);margin-top:2px;}

/* Badges */
.bx{display:inline-flex;align-items:center;font-family:'Syne',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:2px;vertical-align:middle;margin:0 2px;white-space:nowrap;}
.b-agg{background:rgba(200,48,48,.13);color:var(--b-agg);border:1px solid rgba(200,48,48,.28);}
.b-asm{background:rgba(192,120,40,.13);color:var(--b-asm);border:1px solid rgba(192,120,40,.28);}
.b-con{background:rgba(53,128,88,.13);color:var(--b-con);border:1px solid rgba(53,128,88,.28);}
.b-bmk{background:rgba(74,112,184,.13);color:var(--b-bmk);border:1px solid rgba(74,112,184,.28);}

/* Panel */
.panel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.panel-tab{flex:1;padding:11px 4px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:'Syne',sans-serif;transition:all .15s;}
.panel-tab.active{color:var(--deal);border-bottom-color:var(--deal);}
.panel-body{flex:1;overflow-y:auto;padding:14px;}

/* Challenges */
.ch-item{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--border);}
.ch-item:last-child{border-bottom:none;}
.ch-num{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--deal);flex-shrink:0;margin-top:2px;font-weight:500;}
.ch-body{}
.ch-risk{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.ch-text{font-size:12px;line-height:1.55;color:var(--text);}

/* Benchmarks */
.bm-card{background:var(--raised);border:1px solid var(--border);border-radius:4px;padding:11px;margin-bottom:10px;}
.bm-title{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.bm-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:11.5px;}
.bm-row:last-child{border-bottom:none;}
.bm-lbl{color:var(--muted);}
.bm-val{font-family:'IBM Plex Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums;}
.this{color:var(--deal);font-weight:700;}

/* Q&A */
.qa-item{border:1px solid var(--border);border-radius:4px;margin-bottom:8px;overflow:hidden;}
.qa-q{padding:9px 11px;font-size:11.5px;font-weight:600;color:var(--text);background:var(--raised);cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:7px;line-height:1.45;}
.qa-arr{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--deal);flex-shrink:0;transition:transform .15s;}
.qa-arr.open{transform:rotate(90deg);}
.qa-a{padding:11px;font-size:11.5px;line-height:1.62;color:var(--muted);border-top:1px solid var(--border);display:none;}
.qa-a.open{display:block;}
.qa-a strong{color:var(--text);}
.qa-divider{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 0 6px;border-top:1px solid var(--border);margin-top:6px;}
.qa-textarea{width:100%;background:var(--raised);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Syne',sans-serif;font-size:12px;padding:8px 10px;resize:vertical;min-height:68px;}
.qa-textarea:focus{outline:none;border-color:var(--deal);}
.qa-submit{background:var(--deal);color:#fff;border:none;border-radius:3px;padding:7px 14px;font-family:'Syne',sans-serif;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.04em;margin-top:7px;display:block;margin-left:auto;}
.qa-submit:hover{opacity:.84;}
.qa-sent{font-size:11px;color:var(--b-con);margin-top:6px;display:none;}

/* Scenario */
.sc-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;margin-right:8px;align-self:center;}
.sc-group{display:flex;flex-direction:column;gap:5px;min-width:130px;}
.sc-name{font-size:9.5px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;}
.sc-val{font-family:'IBM Plex Mono',monospace;color:var(--text);font-size:10px;}
input[type=range]{width:100%;height:3px;accent-color:var(--deal);cursor:pointer;}
.sc-toggle{display:flex;background:var(--raised);border-radius:3px;padding:2px;gap:2px;}
.sc-btn{padding:3px 8px;border-radius:2px;font-size:9.5px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);letter-spacing:.04em;transition:all .12s;font-family:'Syne',sans-serif;}
.sc-btn.active{background:var(--deal);color:#fff;}
.sc-out{margin-left:auto;display:flex;gap:18px;align-items:center;}
.sc-metric{text-align:right;}
.sc-mlbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.sc-mval{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;color:var(--deal);line-height:1.15;}
.sc-mval.warn{color:var(--b-asm);}
.sc-mval.bad{color:var(--b-agg);}
.sc-msub{font-size:9px;color:var(--muted);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div id="app">
  <header id="top-bar">
    <span class="wordmark">IC Prep</span>
    <div class="deal-tabs" id="deal-tabs">
      <button class="deal-tab active" onclick="switchDeal('nordwind')">NordWind Portfolio</button>
      <button class="deal-tab" onclick="switchDeal('apex')">Apex Healthcare</button>
    </div>
    <span id="rec-chip" class="rec-chip rec-cond">PROCEED — CONDITIONAL</span>
  </header>
  <div id="main-layout">
    <nav id="section-nav"></nav>
    <main id="content-area"><div class="memo-inner" id="memo-inner"></div></main>
    <aside id="right-panel">
      <div class="panel-tabs" id="panel-tabs">
        <button class="panel-tab active" onclick="switchTab('challenges')">Challenges</button>
        <button class="panel-tab" onclick="switchTab('benchmarks')">Benchmarks</button>
        <button class="panel-tab" onclick="switchTab('qa')">Q &amp; A</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </div>
  <div id="scenario-bar"></div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const DEALS = {

nordwind: {
  id:'nordwind', name:'NordWind Portfolio', type:'Infrastructure Equity',
  color:'infra', rec:'PROCEED — CONDITIONAL',
  sections:[
    {
      title:'Executive Summary',
      content:`<div class="metrics-row">
        <div class="m-tile"><div class="m-lbl">Enterprise Value</div><div class="m-val">€852m</div><div class="m-sub">€1.78m / MW</div></div>
        <div class="m-tile"><div class="m-lbl">Equity Committed</div><div class="m-val">€256m</div><div class="m-sub">30% of EV</div></div>
        <div class="m-tile"><div class="m-lbl">Base IRR</div><div class="m-val">9.5%</div><div class="m-sub">Downside: 7.1%</div></div>
        <div class="m-tile"><div class="m-lbl">Hold Period</div><div class="m-val">12 yr</div><div class="m-sub">Exit Year 12</div></div>
        <div class="m-tile"><div class="m-lbl">Distribution Yield</div><div class="m-val">6.2%</div><div class="m-sub">From Year 2</div></div>
      </div>
      <div class="memo-body">
        <p>NordWind Portfolio comprises three operational onshore wind farms — Vindeby (Denmark, 180 MW), Klarälven (Sweden, 160 MW), and Skagerrak (Denmark, 140 MW) — totalling 480 MW of installed capacity. The assets are being acquired from a Scandinavian utility as part of a non-core divestiture. The Fund is seeking to deploy <span class="bx b-asm">Assumption</span>€256m of equity alongside €596m of senior project finance debt (70% LTV), targeting a base case equity IRR of <span class="bx b-bmk">Benchmark</span>9.5% net and a cash distribution yield of 6.2% per annum from Year 2 onward.</p>
        <p>The investment thesis rests on four pillars: an established operational track record (average 11 years), significant revenue certainty through PPAs and Danish green certificate subsidies covering 57% of output through Year 8, partial CPI inflation linkage, and strong alignment with the Fund's liability-driven investment mandate. <span class="bx b-asm">Assumption</span>A refinancing in Year 7 is modelled at 275bps, a key sensitivity given the 7-year forward projection into an uncertain rate environment. The IC is requested to approve a commitment of up to €256m subject to the four conditions set out in Section 9.</p>
      </div>`,
      challenges:[
        {risk:'Return Risk',text:'Is the headline 9.5% IRR presented net of management fees, carried interest, and fund-level expenses? The net-of-all-costs IRR for the Fund\'s LP position may be materially different.'},
        {risk:'Benchmark',text:'How does the 9.5% base IRR compare to the Fund\'s current infrastructure allocation weighted average IRR? Is this additive to or dilutive of portfolio returns?'},
        {risk:'Structural',text:'The memo requests approval for "up to €256m." What triggers a lower deployment and what approval is needed if a co-investor is introduced?'},
        {risk:'Mandate',text:'Does the Fund\'s IPS explicitly permit 70% LTV on infrastructure equity? Some mandates cap project-level leverage for pension fund direct infrastructure investments.'}
      ],
      benchmarks:[
        {title:'Infrastructure Equity IRR — Core/Core+ Vintage 2020–2022',rows:[
          {lbl:'Top Quartile (Q1)',val:'11.8–13.2%'},
          {lbl:'Median',val:'9.1–10.4%'},
          {lbl:'Bottom Quartile (Q3)',val:'7.0–8.2%'},
          {lbl:'This deal (base)',val:'9.5%',this:true},
          {lbl:'Fund minimum threshold',val:'7.0%'},
        ]},
        {title:'EV/MW — European Onshore Wind (Brownfield)',rows:[
          {lbl:'High (subsidy-rich)',val:'€1.9–2.2m/MW'},
          {lbl:'Mid (mixed)',val:'€1.4–1.8m/MW'},
          {lbl:'Low (merchant)',val:'€0.9–1.3m/MW'},
          {lbl:'This deal',val:'€1.78m/MW',this:true},
        ]}
      ]
    },
    {
      title:'Asset Overview',
      content:`<div class="memo-body">
        <p>The three wind farms were commissioned between 2012 and 2016 and have operated with aggregate availability factors consistently above 97%, in line with the industry benchmark for well-maintained onshore assets. Combined P50 annual energy production (AEP) is 1,647 GWh. The portfolio is technically homogeneous: all turbines are <span class="bx b-con">Conservative</span>Vestas V117 3.45MW models, simplifying O&amp;M management and component sourcing. Current O&amp;M is contracted to Vestas under a full-scope service agreement expiring in Year 5.</p>
        <p>Revenue divides into three streams: (i) Danish Green Certificate subsidies (31% of revenue, expiring Years 6 and 8 for Vindeby and Skagerrak respectively), (ii) long-term PPAs with Nordic utilities at €68–74/MWh (26% of revenue, weighted average 8.2 years remaining), and (iii) <span class="bx b-agg">Aggressive</span>merchant sales on NordPool at a base case €72/MWh escalating at 1.5% p.a. (43% of revenue). The weighted average contract life across subsidised and PPA revenue is 7.1 years.</p>
      </div>
      <table class="data-table"><thead><tr><th>Asset</th><th>MW</th><th>Vintage</th><th class="r">P50 AEP (GWh)</th><th class="r">Contract Cover</th><th class="r">Subsidy Expiry</th></tr></thead>
      <tbody>
        <tr><td>Vindeby</td><td>180</td><td>2013</td><td class="r">617</td><td class="r">61%</td><td class="r">Year 6</td></tr>
        <tr><td>Klarälven</td><td>160</td><td>2016</td><td class="r">548</td><td class="r">54%</td><td class="r">Year 13 (SE)</td></tr>
        <tr><td>Skagerrak</td><td>140</td><td>2012</td><td class="r">482</td><td class="r">57%</td><td class="r">Year 8</td></tr>
        <tr><td><strong>Total</strong></td><td><strong>480</strong></td><td>—</td><td class="r"><strong>1,647</strong></td><td class="r"><strong>57%</strong></td><td class="r">—</td></tr>
      </tbody></table>`,
      challenges:[
        {risk:'Technology Risk',text:'The turbines average 11 years of age. Has an independent technical report specifically assessed blade leading-edge erosion — a growing issue for Vestas V117s in their 10th+ year that can reduce energy yield by 2–5% and requires €80–120k per turbine to remediate?'},
        {risk:'O&M Risk',text:'The full-scope Vestas O&M agreement expires in Year 5. What is the estimated re-contracting cost at market terms in Year 5, and how is O&M cost inflation modelled in Years 6–12?'},
        {risk:'Revenue Risk',text:'43% of revenue is merchant with no floor. What is the revenue impact in Year 9 — the first full year of full merchant exposure for Vindeby — under a NordPool price of €55/MWh?'},
        {risk:'Data Quality',text:'P50 AEP is based on which independent energy assessor\'s wind resource study? What period does it cover, and has it been updated to reflect any post-2020 shifts in Scandinavian wind patterns?'}
      ],
      benchmarks:[
        {title:'European Onshore Wind — Capacity Factors',rows:[
          {lbl:'Scandinavia (onshore) P50',val:'28–34%'},
          {lbl:'Scandinavia (onshore) P90',val:'23–28%'},
          {lbl:'NordWind portfolio P50 (implied)',val:'~39%',this:true},
          {lbl:'Note: 39% is above typical range — verify AEP basis',val:''},
        ]},
        {title:'O&M Cost Benchmarks — Onshore Wind',rows:[
          {lbl:'Industry avg (per MW/yr)',val:'€40–55k'},
          {lbl:'Aging assets 10–15yr (per MW/yr)',val:'€55–75k'},
          {lbl:'Memo assumption (per MW/yr)',val:'€58k',this:true},
        ]}
      ]
    },
    {
      title:'Market & Regulatory Context',
      content:`<div class="memo-body">
        <p>NordPool System Price averaged €68.4/MWh in 2025. Independent long-run marginal cost (LRMC) models (Wood Mackenzie, Aurora Energy Research) project a price corridor of €62–85/MWh through 2035, anchored by the marginal cost of new offshore wind at approximately €65/MWh. The base case merchant price assumption of <span class="bx b-asm">Assumption</span>€72/MWh sits mid-range within this corridor but represents a 5.3% premium to the 2025 average — implying the model forecasts modest near-term price recovery.</p>
        <p>Danish renewable energy policy provides a strong institutional backdrop: existing installations are protected from retroactive subsidy changes under Danish Energy Agency policy. However, the subsidy expiry profile creates a <span class="bx b-agg">Aggressive</span>revenue cliff in Years 6 and 8, transitioning Vindeby and Skagerrak to full merchant exposure. Swedish Elcertificat coverage of Klarälven through Year 13 provides a partial offset. The primary regulatory risk is not direct modification of existing subsidies but future changes to merchant market structure — specifically, capacity mechanisms that could compress price cannibalisation risk from accelerating offshore wind additions in the Baltic region.</p>
      </div>`,
      challenges:[
        {risk:'Market Risk',text:'The base case merchant price of €72/MWh assumes a 5% uplift over the 2025 average. What is the basis for this recovery assumption given the structural trend of offshore wind capacity additions compressing NordPool average prices?'},
        {risk:'Regulatory Risk',text:'Has legal counsel confirmed that the Danish Green Certificate agreements contain no retroactive change-of-law provisions that could allow subsidy modification before the contracted expiry date?'},
        {risk:'Cannibalisation',text:'The Baltic offshore pipeline adds approximately 8 GW by 2030. Has the merchant price model been stress-tested against the cannibalisation effect this capacity will have on Swedish and Danish hourly prices — particularly during high-wind periods when the portfolio generates most of its output?'},
        {risk:'Policy Risk',text:'Germany\'s recent capacity market discussions could reshape Nordic power price dynamics. Has the model accounted for potential price linkage effects between the CE and Nordic markets if coupling deepens?'}
      ],
      benchmarks:[
        {title:'NordPool System Price — Historical & Forecast',rows:[
          {lbl:'2023 average',val:'€94/MWh'},
          {lbl:'2024 average',val:'€73/MWh'},
          {lbl:'2025 average',val:'€68/MWh'},
          {lbl:'Base case assumption',val:'€72/MWh',this:true},
          {lbl:'Wood Mackenzie P50 2027',val:'€70–78/MWh'},
          {lbl:'Aurora downside 2027',val:'€56–62/MWh'},
        ]}
      ]
    },
    {
      title:'Financial Model',
      content:`<div class="memo-body">
        <p>The financial model projects total equity distributions of €498m over the 12-year hold period, generating a <span class="bx b-asm">Assumption</span>1.95x equity multiple on €256m invested. Annual EBITDA grows from €78.4m in Year 1 to a peak of €92.1m in Year 7 before contracting to <span class="bx b-agg">Aggressive</span>€71.3m in Year 9 as subsidies expire; the model assumes merchant price recovery to €83/MWh by Year 10 to partially offset the revenue cliff.</p>
        <p>Debt service is structured against a senior project finance facility (€596m, EURIBOR + 200bps, 15-year maturity) targeting a base case DSCR of 1.45x. A mandatory 100% cash sweep applies in any year where DSCR falls below 1.40x. The model flags <span class="bx b-agg">Aggressive</span>two years (Year 8 and Year 9) where DSCR compresses to 1.38x and 1.31x respectively under P90 wind — the latter breaching the 1.35x covenant minimum. Distributions to the Fund are projected from Year 2, with a cash yield rising from 6.2% to 8.1% by Year 5, before potentially pausing in Years 8–9 under the base case cash sweep.</p>
      </div>
      <table class="data-table"><thead><tr><th>Year</th><th class="r">EBITDA (€m)</th><th class="r">Debt Service</th><th class="r">DSCR</th><th class="r">Distribution</th></tr></thead>
      <tbody>
        <tr><td>Y1</td><td class="r">78.4</td><td class="r">36.2</td><td class="r">2.16x</td><td class="r">€15.9m</td></tr>
        <tr><td>Y2</td><td class="r">81.1</td><td class="r">36.1</td><td class="r">2.25x</td><td class="r">€15.9m</td></tr>
        <tr><td>Y5</td><td class="r">89.3</td><td class="r">35.8</td><td class="r">2.49x</td><td class="r">€20.7m</td></tr>

      content:`<div class="memo-body">

      content:`<div class="memo-body">
        <p>The primary risk vector for this transaction is the revenue cliff associated with Danish Green Certificate subsidy expiry in Years 6 and 8. At full merchant exposure, portfolio revenue becomes directly correlated with NordPool prices, which face structural downward pressure from accelerating Baltic offshore wind additions. The base case assumes merchant prices of <span class="bx b-asm">Assumption</span>€72/MWh escalating at 1.5% p.a. — a projection broadly in line with Wood Mackenzie's base but above Aurora Energy Research's base of €66/MWh for 2027–2030.</p>

      a:`<strong>The memo budgets €2.8m p.a. in maintenance capex, rising to €4.5m in Years 8–12</strong> — broadly consistent with industry benchmarks of €40–60k/MW for aging Vestas V117 turbines. However, the memo does not specifically address blade leading-edge erosion (LEE), a growing issue for turbines in their 10th+ year that can reduce energy yield by 2–5% and requires €80–120k per turbine to remediate via leading-edge protection (LEP) coating or blade replacement. <br><br>For the NordWind portfolio (139 turbines across three sites), a full LEP programme would cost approximately <strong>€11–17m</strong> if required — not budgeted in the current capex schedule. More importantly, LEE-degraded blades produce lower AEP during the degradation period, which could further compress DSCR in the already-vulnerable Years 8–9. <strong>The IC should require an independent blade inspection report as a closing condition</strong>, covering not just structural integrity but leading-edge erosion status and estimated remediation costs per turbine.`,

      content:`<div class="memo-body">

      content:`<div class="memo-body">

    {
      title:'Downside & Recovery Analysis',
      content:`<div class="memo-body">
        <p>In a base downside scenario (15% EBITDA decline to €42.7m from the adjusted base), leverage rises to 6.1x and DSCR falls to 1.53x — both within covenant limits. In a <span class="bx b-agg">Aggressive</span>severe downside (35% EBITDA decline to €32.6m), leverage breaches the 6.5x covenant in Year 2, triggering a cure or restructuring event. The presenting team estimates recovery value at €145–170m (3.0–3.5x stressed EBITDA of €32.6m), implying 66–77% recovery on the €220m facility.</p>
        <p>The Fund's internal model uses a more conservative 2.5x stressed EBITDA multiple and deducts estimated enforcement costs of €8m plus the super-senior RCF (€25m drawn), arriving at recovery of approximately <span class="bx b-agg">Aggressive</span>€73–81m (33–37%) — a substantially different picture. The discrepancy reflects two assumptions: the stressed multiple (3.0–3.5x vs. 2.5x) and whether a healthcare staffing business retains its workforce and client relationships through a restructuring process. Three enforcement scenarios are modelled (A: consensual sale 72–77% recovery; B: receivership going-concern 55–65%; C: wind-down 15–25%).</p>

      content:`<div class="memo-body">
        <p>The Fund's private credit allocation target is 8% of AUM (currently 5.6%, representing €650m across 12 positions). Committing €220m would bring the allocation to <span class="bx b-con">Conservative</span>7.5%, approaching target. The Fund's current private credit portfolio is weighted toward senior secured positions (83%) in defensive sectors (healthcare 31%, business services 28%, industrial 24%), with a weighted average gross yield of 9.1%. Apex Healthcare adds a healthcare exposure at a gross yield of 10.2%, above the portfolio weighted average.</p>

        <p>The investment team recommends <strong>PROCEED — CONDITIONAL</strong> on four conditions: (i) line-by-line breakdown of the €8.2m non-recurring EBITDA addbacks with documentary evidence that each item will not recur in Year 1, or adjustment of the leverage calculation to reflect a Conservative Consolidated EBITDA figure agreed with the lenders; (ii) Belgian regulatory counsel's written assessment of the new margin cap's EBITDA impact, reflected in the forward-looking credit model; (iii) <span class="bx b-asm">Assumption</span>commitment size reduced to €195m to bring healthcare staffing concentration to approximately 22% of the enlarged private credit book — requiring a minor IPS waiver rather than a full limit breach; and (iv) equity cure provision amended to require cash injection to reduce outstanding principal rather than EBITDA addback.</p>

    {
      q:'The adjusted EBITDA adds back €8.2m as "non-recurring." But the same type of charges appeared in FY2022 (€6.1m), FY2023 (€7.4m), and FY2024/LTM (€8.2m) — trending upward. How should the IC interpret this?',
      a:`<strong>The upward trend of these "non-recurring" charges is the single most important red flag in this credit.</strong> When restructuring, integration, or system costs appear in three consecutive years with an increasing trend, they are structurally embedded in the operating model — not one-time items. The correct analytical treatment is to run the credit on <strong>reported EBITDA of €42.0m</strong>, not the adjusted figure of €50.2m.<br><br>The implications are significant: on reported EBITDA, entry leverage is <strong>6.2x</strong>, not 5.2x — placing the borrower materially above the European healthcare direct lending median of 4.8x and above the top quartile of 5.5x. It also means the maintenance leverage covenant of 6.5x provides only <strong>0.3x of headroom</strong> on the reported basis — a single quarter of underperformance triggers a breach. <br><br><strong>The IC should require the presenting team to:</strong> (1) provide a line-by-line audit of each addback with prior-year equivalent; (2) explain specifically why Year 1 will be different; and (3) agree a "Conservative Consolidated EBITDA" definition in the credit documentation that caps addbacks at no more than €3–4m annually, consistent with genuine non-recurrence.`,

      a:`<strong>Both estimates may be wrong, but the Fund's more conservative view is better supported by comparable transactions.</strong> The presenting team's 66–77% recovery assumes a 3.0–3.5x stressed EBITDA multiple — which implies a motivated trade buyer at full market conditions during a distress scenario. Comparable distressed healthcare staffing transactions in Europe have cleared at <strong>2.0–2.5x stressed EBITDA</strong>, reflecting the reality that in a workout scenario, recruiter attrition accelerates, client contracts are put on review, and the buyer universe narrows significantly.<br><br>At 2.5x stressed EBITDA of €32.6m, and after deducting the super-senior RCF (€25m) and enforcement costs (~€8m), the recovery on the €220m TL is approximately <strong>€73–81m or 33–37%</strong>.<br><br><strong>It matters enormously for the risk-adjusted yield:</strong> the presenting team's loss-adjusted yield of 9.1% assumes ~110bps of expected loss. The Fund's recovery estimate implies expected loss closer to 250–350bps, producing a loss-adjusted yield of <strong>6.9–7.5%</strong> — which is substantially below the Fund's hurdle for this risk profile. The IC should require an independent third-party credit opinion on the recovery analysis before proceeding.`,

let deal = 'nordwind';

// ─── IRR HELPER ──────────────────────────────────────────────────────────────
function npv(rate, cfs) {
  return cfs.reduce((s,cf,i) => s + cf / Math.pow(1+rate, i), 0);
}
function irr(cfs) {
  let lo = -0.99, hi = 10, mid;
  for(let i=0;i<200;i++){
    mid = (lo+hi)/2;
    if(npv(mid,cfs)>0) lo=mid; else hi=mid;
    if(hi-lo < 0.00001) break;
  }
  return mid;
}

// ─── NORDWIND CALC ───────────────────────────────────────────────────────────
function calcNW(wind, priceDelta, refiSpreads) {
  const windF = wind==='P90'?0.92:wind==='P10'?1.06:1.0;
  const priceAdj = priceDelta/100;
  const refiExtra = (refiSpreads - 275)/10000;

  const equity = 256;
  const debt = 596;
  const ebitdaBase = [78.4,81.1,84.2,86.8,89.3,91.0,92.1,75.2,71.3,80.4,84.8,88.4];
  const debtSvc = [36.2,36.1,35.9,35.8,35.8,35.7,20.4,21.6+refiExtra*420,21.8+refiExtra*418,22.0+refiExtra*415,22.1+refiExtra*412,22.1+refiExtra*408];
  const dsra = 18;

  let cfs = [-equity];
  let minDscr = 99;

  for(let y=0;y<12;y++){
    // Apply wind and price adjustments
    let ebitda = ebitdaBase[y];
    // Wind affects energy yield
    ebitda *= (0.57 + 0.43*windF); // subsidised portion unaffected, merchant portion scaled
    // Actually simplify: wind scales all energy output
    ebitda = ebitdaBase[y] * windF;
    // Price delta affects merchant portion (43% of base revenue, ~43% of EBITDA at steady margin)
    const merchantShare = y >= 6 ? (y===6?0.5:1.0) : 0.43; // grows as subsidies expire
    ebitda = ebitda * (1 + merchantShare * priceAdj);

    const ds = debtSvc[y];
    const dscr = ebitda / ds;
    if(dscr < minDscr) minDscr = dscr;

    const avail = Math.max(0, ebitda - ds - 2.8 - dsra*0.1);
    const dist = dscr < 1.4 ? 0 : avail * 0.85;
    cfs.push(y < 11 ? dist : dist + Math.max(0,(ebitda * 9.5) - debtSvc.slice(y).reduce((a,b)=>a+b,0)*3));
  }
  // exit value
  const exitEBITDA = ebitdaBase[11] * windF * (1 + 0.43 * priceAdj);
  const remainDebt = 250;
  const exitEquity = Math.max(0, exitEBITDA * 9.5 - remainDebt);
  cfs[12] = (cfs[12]||0) + exitEquity;

  const r = irr(cfs);
  const irrPct = Math.round(r*1000)/10;
  const dscrRounded = Math.round(minDscr*100)/100;
  return { irr: irrPct, dscr: dscrRounded };
}

// ─── APEX CALC ───────────────────────────────────────────────────────────────
function calcApex(ebitdaGrowth, defaultYr, recovery) {
  const principal = 220;
  const deployed = 216.7; // after OID
  const spread = 0.0575;
  const euribor = 0.035;
  const coupon = (spread + euribor) * principal;
  const hold = 5;
  const recRate = recovery / 100;

  let cfs = [-deployed];

  if(defaultYr === 'none') {
    for(let y=1;y<=hold;y++) cfs.push(y===hold ? coupon + principal : coupon);
    const g = irr(cfs);
    const grossYield = Math.round(g*1000)/10;
    const eloss = 0.05 * (1 - 0.65); // 5% PD, 65% rec
    const adjYield = Math.round((g - eloss)*1000)/10;
    return { gross: grossYield, adj: adjYield };
  } else {
    const dy = parseInt(defaultYr);
    for(let y=1;y<=hold;y++){
      if(y < dy) cfs.push(coupon);
      else if(y === dy) { cfs.push(principal * recRate); break; }
    }
    const g = irr(cfs);
    const grossYield = Math.round(g*1000)/10;
    const adjYield = grossYield; // already reflects default
    return { gross: grossYield, adj: adjYield };
  }
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function setDealColor(d) {
  document.documentElement.style.setProperty('--deal', `var(--${DEALS[d].color})`);
}

function renderNav() {
  const d = DEALS[deal];
  const nav = document.getElementById('section-nav');
  nav.innerHTML = `<div class="nav-label">${d.type}</div>` +
    d.sections.map((s,i) =>
      `<div class="nav-item${i===sec?' active':''}" onclick="goSec(${i})">
        <span class="nav-num">${String(i+1).padStart(2,'0')}</span>
        <span>${s.title}</span>
      </div>`
    ).join('');
}

function renderContent() {
  const s = DEALS[deal].sections[sec];
  const inner = document.getElementById('memo-inner');
  inner.innerHTML = `
    <div class="section-eye">${DEALS[deal].type}</div>
    <h1 class="section-title">${s.title}</h1>
    ${s.content}
  `;
}

function renderPanel() {
  const s = DEALS[deal].sections[sec];
  const body = document.getElementById('panel-body');

  if(tab === 'challenges') {
    body.innerHTML = s.challenges.map((c,i) =>
      `<div class="ch-item">
        <div class="ch-num">${String(i+1).padStart(2,'0')}</div>
        <div class="ch-body">
          <div class="ch-risk">${c.risk}</div>
          <div class="ch-text">${c.text}</div>
        </div>
      </div>`
    ).join('');

  } else if(tab === 'benchmarks') {
    body.innerHTML = s.benchmarks.map(bm =>
      `<div class="bm-card">
        <div class="bm-title">${bm.title}</div>
        ${bm.rows.map(r =>
          `<div class="bm-row">
            <span class="bm-lbl">${r.lbl}</span>
            <span class="bm-val${r.this?' this':''}">${r.val}</span>
          </div>`
        ).join('')}
      </div>`
    ).join('');

  } else {
    const qa = DEALS[deal].qa;
    body.innerHTML = qa.map((item,i) =>
      `<div class="qa-item">
        <div class="qa-q" onclick="toggleQA(${i})">
          <span>${item.q}</span>
          <span class="qa-arr${item.open?' open':''}" id="qa-arr-${i}">›</span>
        </div>
        <div class="qa-a${item.open?' open':''}" id="qa-a-${i}">${item.a}</div>
      </div>`
    ).join('') +
    `<div class="qa-divider">Your Question</div>
     <div class="qa-input-row">
       <textarea class="qa-textarea" id="qa-input" placeholder="Type a question about this deal or memo section…" rows="3"></textarea>
       <button class="qa-submit" onclick="sendQ()">Send to Claude →</button>
       <div class="qa-sent" id="qa-sent">✓ Sent — Claude will respond in chat.</div>
     </div>`;
  }
}

  const bar = document.getElementById('scenario-bar');
  if(deal === 'nordwind') {
    bar.innerHTML = `

      <div class="sc-group">
        <div class="sc-name">Wind Yield</div>

let windSel = 'P50';
let defaultSel = 'none';

function setWind(w) {
  windSel = w;
  ['P50','P90','P10'].forEach(x => document.getElementById('w-'+x).classList.toggle('active', x===w));
  updateScenario();
}

function setDefault(d) {
  defaultSel = d;
  ['none','2','3'].forEach(x => {
    const el = document.getElementById('dy-'+x);
    if(el) el.classList.toggle('active', x===d);
  });
  updateScenario();
}

function updateScenario() {
  const out = document.getElementById('sc-out');
  if(!out) return;

  if(deal === 'nordwind') {
    const price = parseInt(document.getElementById('sl-price').value)||0;
    const refi = parseInt(document.getElementById('sl-refi').value)||275;
    document.getElementById('sl-price-val').textContent = (price>=0?'+':'')+price+' €/MWh';
    document.getElementById('sl-refi-val').textContent = refi+' bps';
    const res = calcNW(windSel, price, refi);
    const irrClass = res.irr >= 9 ? '' : res.irr >= 7 ? 'warn' : 'bad';
    const dscrClass = res.dscr >= 1.35 ? '' : res.dscr >= 1.2 ? 'warn' : 'bad';
    out.innerHTML = `
      <div class="sc-metric">
        <div class="sc-mlbl">Equity IRR</div>
        <div class="sc-mval ${irrClass}">${res.irr.toFixed(1)}%</div>
        <div class="sc-msub">Base: 9.5%</div>
      </div>
      <div class="sc-metric">
        <div class="sc-mlbl">Min DSCR</div>
        <div class="sc-mval ${dscrClass}">${res.dscr.toFixed(2)}x</div>
        <div class="sc-msub">Cov floor: 1.35x</div>
      </div>`;

  } else {
    const eg = parseInt(document.getElementById('sl-eg').value)||5;
    const rec = parseInt(document.getElementById('sl-rec').value)||65;
    document.getElementById('sl-eg-val').textContent = (eg>=0?'+':'')+eg+'% pa';
    document.getElementById('sl-rec-val').textContent = rec+'%';
    const res = calcApex(eg, defaultSel, rec);
    const adjClass = res.adj >= 8 ? '' : res.adj >= 6 ? 'warn' : 'bad';
    out.innerHTML = `
      <div class="sc-metric">
        <div class="sc-mlbl">Gross Yield</div>
        <div class="sc-mval">${res.gross.toFixed(1)}%</div>
        <div class="sc-msub">Base: 10.2%</div>
      </div>
      <div class="sc-metric">
        <div class="sc-mlbl">Loss-Adj. Yield</div>
        <div class="sc-mval ${adjClass}">${res.adj.toFixed(1)}%</div>
        <div class="sc-msub">Target: 9.1%</div>
      </div>`;
  }
}

function toggleQA(i) {
  DEALS[deal].qa[i].open = !DEALS[deal].qa[i].open;
  const ans = document.getElementById('qa-a-'+i);
  const arr = document.getElementById('qa-arr-'+i);
  if(ans) ans.classList.toggle('open', DEALS[deal].qa[i].open);
  if(arr) arr.classList.toggle('open', DEALS[deal].qa[i].open);
}

function sendQ() {
  const txt = (document.getElementById('qa-input')||{}).value||'';
  if(!txt.trim()) return;
  const d = DEALS[deal];
  const s = d.sections[sec];
  const ctx = `[IC Prep Tool — ${d.name} / Section: ${s.title}]\n\nQuestion from IC member: ${txt}`;
  if(typeof sendPrompt === 'function') {
    sendPrompt(ctx);
    const sent = document.getElementById('qa-sent');
    if(sent) { sent.style.display='block'; setTimeout(()=>{ if(sent) sent.style.display='none'; },4000); }
    const inp = document.getElementById('qa-input');
    if(inp) inp.value='';
  }
}

function switchDeal(d) {
  deal = d; sec = 0; windSel='P50'; defaultSel='none';
  setDealColor(d);
  document.getElementById('rec-chip').textContent = DEALS[d].rec;
  document.querySelectorAll('.deal-tab').forEach((el,i) => el.classList.toggle('active', (i===0&&d==='nordwind')||(i===1&&d==='apex')));
  renderNav(); renderContent(); renderPanel(); renderScenario();
}

function goSec(i) {
  sec = i;
  renderNav(); renderContent(); renderPanel();
  document.getElementById('content-area').scrollTop=0;
}

function switchTab(t) {
  tab = t;
  document.querySelectorAll('.panel-tab').forEach(el => el.classList.toggle('active', el.textContent.trim().toLowerCase().startsWith(t.replace('qa','q'))));
  renderPanel();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
setDealColor(deal);
renderNav();
renderContent();
renderPanel();
renderScenario();
</script>
